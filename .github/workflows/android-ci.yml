name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # Current Android command-line tools require JDK 17. Gradle 6.7.1
      # and this legacy Android Gradle Plugin are built with JDK 11.
      - name: Set up JDK 17 for Android SDK tools
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3"

      - name: Set up JDK 11 for Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"

      - name: Set up Gradle 6.7.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "6.7.1"

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Build, test, and lint both modules
        run: |
          gradle --no-daemon clean \
            :lockscreen:testDebugUnitTest \
            :sample:testDebugUnitTest \
            :lockscreen:assembleDebug \
            :sample:assembleDebug \
            :lockscreen:lintDebug \
            :sample:lintDebug

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-validation-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
